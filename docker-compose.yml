version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybersentinel-backend
    ports:
      - "8000:8080"
    environment:
      - PYTHONPATH=/app/src
      - PORT=8080
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./cybersentinel-dashboard
      dockerfile: Dockerfile.frontend
    container_name: cybersentinel-frontend
    ports:
      - "4200:80"
    environment:
      - API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: cybersentinel-network
