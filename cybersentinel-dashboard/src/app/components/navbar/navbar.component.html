          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">

           [routerLinkActiveOptions]="{exact: true}"

          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>

           routerLinkActive="text-cyan-400 font-semibold"

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Scan Message
        </a>

        <a routerLink="/model-performance"
           routerLinkActive="text-cyan-400 font-semibold"
           class="text-gray-300 hover:text-cyan-400 transition-colors flex items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

          <div [ngClass]="{
            'w-2 h-2 rounded-full': true,
            'bg-green-400 animate-pulse': systemStatus?.status === 'online',
            'bg-red-400': systemStatus?.status !== 'online'
          }"></div>
          <span class="text-xs font-medium text-white">
            {{ systemStatus?.status === 'online' ? 'Online' : 'Offline' }}
          </span>
        </div>
      </div>

      <!-- Mobile Menu Button -->
      <button (click)="toggleMenu()" class="md:hidden text-white p-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>

         (click)="toggleMenu()"
         routerLinkActive="bg-cyan-400/20 text-cyan-400"
         [routerLinkActiveOptions]="{exact: true}"
         class="flex items-center gap-2 px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>

        Dashboard

      <a routerLink="/sms-detection"
         (click)="toggleMenu()"
         routerLinkActive="bg-cyan-400/20 text-cyan-400"
         class="flex items-center gap-2 px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>

      </a>

      <a routerLink="/model-performance"
         (click)="toggleMenu()"
         routerLinkActive="bg-cyan-400/20 text-cyan-400"
         class="flex items-center gap-2 px-4 py-3 rounded-xl text-gray-300 hover:bg-white/5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
        </svg>
        Performance
      </a>

      <div class="flex items-center gap-2 px-4 py-3">
        <div [ngClass]="{
          'w-2 h-2 rounded-full': true,
          'bg-green-400 animate-pulse': systemStatus?.status === 'online',
          'bg-red-400': systemStatus?.status !== 'online'
        }"></div>
        <span class="text-sm text-gray-400">
          System: {{ systemStatus?.status === 'online' ? 'Online' : 'Offline' }}
        </span>
      </div>
    </div>
  </div>

<!-- Spacer for fixed navbar -->
<div class="h-20"></div>
