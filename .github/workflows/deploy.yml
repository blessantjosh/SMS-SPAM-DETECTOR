name: Deploy CyberSentinel AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r api_requirements.txt

    - name: Install Frontend dependencies
      working-directory: ./cybersentinel-dashboard
      run: npm ci

    - name: Build Frontend
      working-directory: ./cybersentinel-dashboard
      run: npm run build --if-present

    - name: Run Backend Tests (if any)
      run: |
        echo "Backend tests would run here"
        # pytest tests/ --cov=src

    - name: Archive build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: production-files
        path: |
          cybersentinel-dashboard/dist/
          backend/
          models/
          src/

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        name: production-files

    - name: Deploy to Production
      run: |
        echo "Deployment step - configure based on your hosting platform"
        echo "Options: Vercel, Netlify, AWS, Azure, GCP, Heroku, Railway"
